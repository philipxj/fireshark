name: Temporary SuperMote screenshot crop

on:
  push:
    branches:
      - codex/fireshark-high-quality-redesign
    paths:
      - .github/workflows/crop-supermote-temp.yml

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fireshark-high-quality-redesign

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Crop and resize screenshots
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          crop = (172, 520, 1026, 2320)
          target_width = 600

          for path in sorted(Path('image/supermote').glob('screen_*.webp')):
              with Image.open(path) as source:
                  cropped = source.crop(crop)
                  target_height = round(cropped.height * target_width / cropped.width)
                  cropped = cropped.resize((target_width, target_height), Image.Resampling.LANCZOS)
                  cropped.save(path, 'WEBP', quality=85, method=6)
                  print(f'{path}: {source.size} -> {cropped.size}')
          PY

      - name: Commit cropped assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add image/supermote/screen_*.webp
          if git diff --cached --quiet; then
            echo "No screenshot changes"
            exit 0
          fi
          git commit -m "fix: crop SuperMote screenshots"
          git push
